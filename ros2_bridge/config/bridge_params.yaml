umst_gate_bridge:
  ros__parameters:
    gate_url: "http://localhost:8787"
    rate_hz: 10.0
    timeout_s: 1.0

umst_telemetry_bridge:
  ros__parameters:
    ws_url: "ws://localhost:8766/telemetry"
    reconnect_interval_s: 5.0

# UR10e safety defaults: workspace 1.3m, TCP 0.25 m/s, payload 10 kg
umst_robot_controller:
  ros__parameters:
    dry_run: true
