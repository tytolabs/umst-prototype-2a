# SPDX-License-Identifier: MIT
name: README sanity

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  readme-sanity:
    name: README sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README sanity (catch accidental wipes)
        run: |
          set -euo pipefail
          lines=$(wc -l < README.md)
          if [ "$lines" -lt 20 ]; then
            echo "FAIL: README.md is suspiciously short ($lines lines)"
            exit 1
          fi
          echo "OK: README.md has $lines lines"
